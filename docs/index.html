<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101114;--pan:#17181d;--line:#2a2c33;--tx:#eceef0;--dim:#7d818c;--w:#f4f4f2}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.v{display:none}.v.on{display:block}
.cap{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
button{font-family:inherit;cursor:pointer;color:var(--tx)}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 20px 18px}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.out{background:none;border:1px solid var(--line);padding:14px 16px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;border-radius:2px}
.search{margin:0 20px 18px;display:flex;gap:12px;align-items:center;background:var(--pan);border:1px solid var(--line);padding:0 16px}
.search input{flex:1;background:none;border:0;color:var(--tx);font:16px Manrope;padding:18px 0;outline:0}
.tabs{display:flex;overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:18px 20px;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.tab.on{color:var(--w);border-color:var(--w)}
.filters{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.sw{display:flex;gap:14px;align-items:center;background:none;border:0;font-size:15px}
.sw i{width:42px;height:24px;border:1px solid var(--dim);position:relative;display:block}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--dim);transition:.15s}
.sw.on i:after{left:21px;background:var(--w)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 16px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pic{position:relative;height:150px;display:grid;place-items:center;font-size:66px;background:radial-gradient(circle at 70% 20%,#3a3d46 0,#17181d 55%),#17181d}
.pic.no{filter:grayscale(1) brightness(.6)}
.badge{position:absolute;top:10px;left:10px;background:var(--w);color:#111;font-size:10px;font-weight:800;letter-spacing:.14em;padding:6px 9px;border-radius:99px}
.badge.no{background:#444;color:#bbb}
.inf{padding:14px;display:flex;flex-direction:column;flex:1}
.nm{font-size:16px;font-weight:600;line-height:1.25}.sub{color:var(--dim);font-size:14px;margin-top:4px}
.ft{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.pr{font-size:17px;font-weight:800}
.pick{background:none;border:0;font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--dim);padding:6px 0}
.pick:disabled{opacity:.4}
.st button{width:28px;height:28px;background:none;border:1px solid var(--line);font-size:16px;border-radius:2px}.st b{display:inline-block;min-width:24px;text-align:center}
.cbar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--w);color:#111;border:0;padding:17px;font-weight:800;font-size:14px;letter-spacing:.1em;display:none;justify-content:space-between;border-radius:2px;z-index:5}
.hd{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sq{width:48px;height:48px;background:var(--pan);border:1px solid var(--line);font-size:20px;border-radius:2px}
.hd b{font-size:20px;font-weight:800;display:block}.hd .cap{font-size:11px}.hd .sp{flex:1}
.pad{padding:16px}
.pan{background:var(--pan);border:1px solid var(--line);padding:16px;margin-bottom:12px;border-radius:2px}
.usr{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border:1px solid var(--line);background:#0c0d10;object-fit:cover}
.lv{margin-left:auto;border:1px solid var(--w);padding:7px 12px;font-size:12px;font-weight:800;letter-spacing:.14em}
.bar{height:6px;background:#26272d;margin:12px 0 10px}.bar i{display:block;height:100%;background:var(--w);width:0;transition:width .4s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-size:26px;font-weight:800;margin:10px 0 4px}
.ach{background:var(--pan);border:1px solid var(--line);padding:14px;border-radius:2px}
.ach.ok{border-color:#8d8f98}
.ach .xp{float:right;border:1px solid var(--line);padding:4px 7px;font-size:11px;font-weight:600}
.ach b{display:block;font-size:15px;margin:14px 0 4px}.ach p{font-size:12px;color:var(--dim);min-height:32px}
.ach .n{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.sec{display:flex;justify-content:space-between;margin:22px 0 12px}
label{display:block;margin:16px 0 8px}
.fi{width:100%;background:#0f1013;border:1px solid var(--line);padding:16px;color:var(--tx);font:16px Manrope;border-radius:2px}
.save{width:100%;margin-top:18px;background:none;border:1px solid var(--w);padding:17px;font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase;border-radius:2px}
.save.fill{background:var(--w);color:#111}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.line:last-child{border:0}
.emp{text-align:center;color:var(--dim);padding:26px 8px;font-size:14px}
:focus-visible{outline:2px dashed var(--w);outline-offset:2px}
</style>
</head>
<body>

<section class="v on" id="v-shop">
  <div class="top"><div><h1 id="store"></h1><div class="cap" style="margin-top:10px" id="tag"></div></div>
    <button class="out" id="toMe"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Профиль</button></div>
  <label class="search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7d818c" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Поиск товара…"></label>
  <div class="tabs" id="tabs"></div>
  <div class="filters"><button class="sw" id="sw"><i></i>Только в наличии</button><button class="out" id="sort">⇅ Цена</button></div>
  <div class="grid" id="grid"></div>
  <button class="cbar" id="cbar"></button>
</section>

<section class="v" id="v-cart">
  <div class="hd"><button class="sq back">←</button><div><span class="cap">Заказ</span><b>Корзина</b></div></div>
  <div class="pad"><div class="pan" id="clist"></div><button class="save fill" id="order">Оформить заказ</button></div>
</section>

<section class="v" id="v-me">
  <div class="hd"><button class="sq back">←</button><div><span class="cap" id="hs"></span><b>Личный профиль</b></div><span class="sp"></span><button class="sq" id="ref">⟳</button></div>
  <div class="pad">
    <div class="pan">
      <div class="usr"><img class="av" id="av" alt=""><div><b id="un" style="font-size:18px">Гость</b><div class="dim cap" style="letter-spacing:0;text-transform:none;font-size:14px" id="ut"></div></div><span class="lv" id="lv"></span></div>
      <div class="pan" style="margin:16px 0 14px;background:#13141a"><div style="display:flex;justify-content:space-between"><span class="cap">Ранг</span><b id="xp"></b></div><b id="rk" style="font-size:19px;display:block;margin-top:8px"></b><div class="bar"><i id="xb"></i></div><div class="cap" style="font-size:12px;letter-spacing:.04em;text-transform:none" id="xt"></div></div>
      <div class="two"><div class="pan" style="margin:0"><span class="cap">Заказов</span><div class="big" id="s1">0</div><div class="dim cap" style="letter-spacing:0;text-transform:none;font-size:13px">Оформлено</div></div><div class="pan" style="margin:0"><span class="cap">Потрачено</span><div class="big" id="s2">0</div><div class="cap" style="letter-spacing:0;text-transform:none;font-size:13px">По всем заказам</div></div></div>
    </div>
    <div class="sec"><span class="cap">🏆 Достижения</span><b id="ac"></b></div>
    <div class="two" id="achs"></div>
    <div class="pan" style="margin-top:22px">
      <div style="display:flex;justify-content:space-between"><b>Данные доставки</b><span class="cap">Автозаполнение</span></div>
      <label class="cap">Имя получателя</label><input class="fi" id="fn" autocomplete="name">
      <label class="cap">Телефон</label><input class="fi" id="fp" type="tel" placeholder="+7" autocomplete="tel">
      <label class="cap">Город и адрес доставки</label><input class="fi" id="fa" placeholder="г. Алматы, ул. Абая 10, кв. 25" autocomplete="street-address">
      <label class="cap">Комментарий курьеру</label><input class="fi" id="fc" placeholder="Подъезд 2, этаж 4, домофон 25К">
      <button class="save" id="sv">Сохранить данные доставки</button>
    </div>
    <div class="sec"><span class="cap">История заказов · <span id="hc">0</span></span></div>
    <div class="pan" id="hist"></div>
  </div>
</section>

<script>
const {SB,KEY}=window.CFG;
const STORE="SPLYXX", TAG="PAPOI STORE", CUR="₸";
let P=[];
const R=[["Клиент",0],["Заглянул на огонёк",150],["Свой человек",400],["Постоянный клиент",900],["Легенда",1800]];
const A=[
 ["Первый заказ","1 оформленный заказ",100,1,s=>s.o],
 ["Третий заход","3 заказа",200,3,s=>s.o],
 ["Ночная сова","Заказ ночью (22:00–05:00)",150,1,s=>s.night],
 ["Фил","Купить 5 пар наушников",200,5,s=>s.u["Наушники"]||0],
 ["Мажор","Купить 2 телефона",150,2,s=>s.u["Телефоны"]||0],
 ["Мелочёвка","Купить 5 мышек",150,5,s=>s.u["Мышки"]||0],
 ["Затарился по-братски","5 и более единиц в одном заказе",200,5,s=>s.mu],
 ["Разносторонний","Купить 6 разных товаров",250,6,s=>s.d],
 ["Три в одном","3 категории в одном заказе",150,3,s=>s.mc],
 ["Тяжёлый люкс","Один заказ от 50 000 "+CUR,300,50000,s=>s.max],
 ["Ветеран","10 заказов",400,10,s=>s.o],
 ["Крёстный отец кассы","Потратить 150 000 "+CUR,600,150000,s=>s.sum]];
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand()}
const $=i=>document.getElementById(i),f=n=>n.toLocaleString("ru-RU")+" "+CUR;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cart={},cat="Все",only=false,sort=0,db={orders:[],form:{}};
try{db=JSON.parse(localStorage.getItem("shop2")||"")||db}catch(e){}
const save=()=>{try{localStorage.setItem("shop2",JSON.stringify(db))}catch(e){}};
const U=tg?.initDataUnsafe?.user||{};
$("store").textContent=STORE;$("tag").textContent=TAG;$("hs").textContent=STORE;

function go(v){document.querySelectorAll(".v").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));
 if(v==="me")me();if(v==="cart")rcart();if(v==="shop")shop();scrollTo(0,0)}
$("toMe").onclick=()=>go("me");$("cbar").onclick=()=>go("cart");
document.querySelectorAll(".back").forEach(b=>b.onclick=()=>go("shop"));$("ref").onclick=me;

function shop(){
 const cats=["Все",...new Set(P.map(p=>p.c))];
 $("tabs").innerHTML=cats.map(c=>`<button class="tab ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
 const q=$("q").value.trim().toLowerCase();
 let l=P.filter(p=>(cat==="Все"||p.c===cat)&&(!only||p.st>0)&&(!q||(p.n+p.s).toLowerCase().includes(q)));
 if(sort)l=[...l].sort((a,b)=>(a.p-b.p)*sort);
 $("grid").innerHTML=l.length?l.map(p=>`<div class="card"><div class="pic ${p.st?"":"no"}">${p.img?`<img src="${p.img}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:p.e}<span class="badge ${p.st?"":"no"}">${p.st?"В НАЛИЧИИ":"НЕТ В НАЛИЧИИ"}</span></div>
 <div class="inf"><div class="nm">${p.n}</div><div class="sub">${p.s}</div><div class="ft"><span class="pr">${f(p.p)}</span>
 ${cart[p.id]?`<span class="st"><button data-i="${p.id}" data-d="-1">−</button><b>${cart[p.id]}</b><button data-i="${p.id}" data-d="1">+</button></span>`:`<button class="pick" data-i="${p.id}" data-d="1" ${p.st?"":"disabled"}>ВЫБРАТЬ →</button>`}</div></div></div>`).join(""):`<div class="emp" style="grid-column:1/-1">Ничего не найдено</div>`;
 const n=Object.values(cart).reduce((a,b)=>a+b,0);
 $("cbar").style.display=n?"flex":"none";$("cbar").innerHTML=`<span>КОРЗИНА · ${n}</span><span>${f(tot())} →</span>`;
}
$("tabs").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;shop()}};
$("q").oninput=shop;
$("sw").onclick=()=>{only=!only;$("sw").classList.toggle("on",only);shop()};
$("sort").onclick=()=>{sort=sort===1?-1:1;$("sort").textContent=sort===1?"↑ Цена":"↓ Цена";shop()};
function chg(e){const b=e.target.closest("[data-i]");if(!b)return;const i=b.dataset.i;
 cart[i]=(cart[i]||0)+ +b.dataset.d;if(cart[i]<=0)delete cart[i];tg?.HapticFeedback?.impactOccurred("light");
 $("v-cart").classList.contains("on")?rcart():shop()}
$("grid").onclick=chg;$("clist").onclick=chg;
const tot=()=>Object.entries(cart).reduce((s,[i,q])=>s+P.find(p=>p.id==i).p*q,0);

function rcart(){const k=Object.keys(cart);
 $("order").style.display=k.length?"block":"none";
 $("clist").innerHTML=k.length?k.map(i=>{const p=P.find(x=>x.id==i);return `<div class="line"><div><div class="nm">${p.e} ${p.n}</div><div class="sub">${f(p.p)}</div></div><span class="st"><button data-i="${i}" data-d="-1">−</button><b>${cart[i]}</b><button data-i="${i}" data-d="1">+</button></span></div>`}).join("")
 +`<div class="line"><b>Итого</b><b>${f(tot())}</b></div>`:`<div class="emp">Корзина пуста</div>`}

$("order").onclick=async()=>{const d=db.form;
 if(!d.name||!d.phone||!d.addr){alert("Сначала заполни данные доставки в профиле");go("me");return}
 $("order").disabled=true;
 try{
  const r=await fetch(SB+"/rest/v1/rpc/create_order",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},
   body:JSON.stringify({p_items:Object.entries(cart).map(([id,qty])=>({id:+id,qty})),p_name:d.name,p_phone:d.phone,p_addr:d.addr,p_note:d.note||"",p_tg_id:U.id||null,p_tg_username:U.username||null})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.message||"Не удалось оформить заказ");
  db.orders.unshift({ts:Date.now(),h:new Date().getHours(),sum:j.total,items:j.items,addr:d.addr});save();cart={};
  const pl={type:"order",id:j.id,items:j.items.map(({name,qty,price})=>({name,qty,price})),sum:j.total,cur:CUR,name:d.name,phone:d.phone,addr:d.addr,note:d.note||""};
  if(tg)tg.sendData(JSON.stringify(pl));else{alert("Заказ №"+j.id+" создан");go("shop")}
 }catch(e){alert(e.message);await loadP()}
 $("order").disabled=false};

function stats(){const o=db.orders,s={o:o.length,sum:0,max:0,night:0,u:{},mu:0,mc:0},ids=new Set;
 o.forEach(x=>{s.sum+=x.sum;s.max=Math.max(s.max,x.sum);if(x.h>=22||x.h<5)s.night++;
  let u=0;const c=new Set;x.items.forEach(i=>{u+=i.qty;ids.add(i.id);c.add(i.cat);s.u[i.cat]=(s.u[i.cat]||0)+i.qty});
  s.mu=Math.max(s.mu,u);s.mc=Math.max(s.mc,c.size)});s.d=ids.size;return s}

function me(){const s=stats();
 $("un").textContent=[U.first_name,U.last_name].filter(Boolean).join(" ")||"Гость";$("ut").textContent=U.username?"@"+U.username:"";
 if(U.photo_url){$("av").src=U.photo_url}else $("av").style.display="none";
 let xp=s.o*50+Math.floor(s.sum/200),done=0;
 $("achs").innerHTML=A.map(a=>{const c=Math.min(a[4](s),a[3]),ok=c>=a[3];if(ok){xp+=a[2];done++}
  return `<div class="ach ${ok?"ok":""}"><span class="xp">+${a[2]} XP</span><b>${a[0]}</b><p>${a[1]}</p><div class="bar" style="margin:8px 0"><i style="width:${c/a[3]*100}%"></i></div><div class="n"><span>${c>=1000?c.toLocaleString("ru-RU"):c} / ${a[3]>=1000?a[3].toLocaleString("ru-RU"):a[3]}</span><span>+${a[2]} XP</span></div></div>`}).join("");
 let r=0;R.forEach((x,i)=>{if(xp>=x[1])r=i});const nx=R[r+1];
 $("lv").textContent="LVL "+(r+1);$("rk").textContent=R[r][0];$("xp").textContent=xp+" XP";
 $("xb").style.width=(nx?(xp-R[r][1])/(nx[1]-R[r][1])*100:100)+"%";
 $("xt").textContent=nx?`До «${nx[0]}»: ${nx[1]-xp} XP`:"Максимальный ранг";
 $("ac").textContent=done+" / "+A.length;$("s1").textContent=s.o;$("s2").textContent=f(s.sum);
 const d=db.form;$("fn").value=d.name||$("fn").value||[U.first_name,U.last_name].filter(Boolean).join(" ");
 $("fp").value=d.phone||$("fp").value;$("fa").value=d.addr||$("fa").value;$("fc").value=d.note||$("fc").value;
 $("hc").textContent=db.orders.length;
 $("hist").innerHTML=db.orders.length?db.orders.map(x=>`<div class="line"><div><div class="nm" style="font-size:14px">${esc(x.items.map(i=>i.name+" ×"+i.qty).join(", "))}</div><div class="sub" style="font-size:12px">${new Date(x.ts).toLocaleDateString("ru-RU")} · ${esc(x.addr)}</div></div><b>${f(x.sum)}</b></div>`).join(""):`<div class="emp">У вас пока нет оформленных заказов</div>`}
$("sv").onclick=()=>{db.form={name:$("fn").value.trim(),phone:$("fp").value.trim(),addr:$("fa").value.trim(),note:$("fc").value.trim()};save();
 $("sv").textContent="Сохранено ✓";tg?.HapticFeedback?.notificationOccurred("success");setTimeout(()=>$("sv").textContent="Сохранить данные доставки",1500)};
function loadP(){return fetch(SB+"/rest/v1/products?select=*&order=id",{headers:{apikey:KEY}}).then(r=>r.ok?r.json():Promise.reject())
 .then(d=>{P=d.map(x=>({id:x.id,c:x.cat,n:x.name,s:x.sub,p:x.price,e:x.emoji,st:x.stock,img:x.img?`${SB}/storage/v1/object/public/products/${x.img}`:""}));
  Object.keys(cart).forEach(i=>{if(!P.find(p=>p.id==i))delete cart[i]});shop();if($("v-cart").classList.contains("on"))rcart()})
 .catch(()=>{$("grid").innerHTML='<div class="emp" style="grid-column:1/-1">Не удалось загрузить товары</div>'})}
$("grid").innerHTML='<div class="emp" style="grid-column:1/-1">Загрузка…</div>';loadP();
</script>
</body>
</html>
