
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif}
.header{background:linear-gradient(135deg,#6C63FF 0%,#48CAE4 100%);padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.header-title{color:white;font-size:18px;font-weight:900}
.header-sub{color:rgba(255,255,255,0.85);font-size:11px;font-weight:600}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.stars-badge{background:rgba(255,255,255,0.2);border-radius:20px;padding:4px 10px;color:white;font-size:13px;font-weight:800}
.lang-btn{background:rgba(255,255,255,0.15);border:none;border-radius:8px;padding:4px 8px;color:white;font-size:11px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif}

.tab-bar{display:flex;background:#f4f3ff;border-bottom:2px solid #e0deff;overflow-x:auto;scrollbar-width:none}

.tab{flex-shrink:0;padding:9px 10px;text-align:center;font-size:10px;font-weight:800;color:#9b97cc;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.active{color:#6C63FF;border-bottom-color:#6C63FF;background:white}
.sentence-bar{background:white;border-bottom:2px dashed #e0deff;padding:8px 12px;min-height:60px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sentence-placeholder{color:#c0b8f0;font-size:12px;font-weight:700;width:100%;text-align:center}
.sentence-card{background:#6C63FF;color:white;border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;min-width:50px;max-width:70px}
.sentence-card .sem{font-size:18px;line-height:1}
.sentence-card .sph{width:36px;height:36px;border-radius:6px;object-fit:cover}
.sentence-card .slb{font-size:9px;font-weight:800;text-transform:uppercase;text-align:center;line-height:1.1}
.sentence-card .srm{position:absolute;top:-5px;right:-5px;background:#ff6b6b;color:white;border-radius:50%;width:15px;height:15px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer}
.action-bar{display:flex;gap:6px;padding:7px 12px;background:white;border-bottom:1px solid #f0eeff}
.btn{border:none;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s}
.btn-speak{background:#6C63FF;color:white;flex:1}
.btn-speak:hover{background:#5a52e0}
.btn-clear{background:#ffe0e0;color:#d63031}
.btn:active{transform:scale(0.95)}
.cat-tabs{display:flex;gap:5px;padding:7px 12px 4px;overflow-x:auto;background:#faf9ff;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-btn{border:2px solid transparent;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;background:white;transition:all .15s}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;background:#faf9ff}
.pecs-card{background:white;border-radius:14px;border:2.5px solid #e8e4ff;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.pecs-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(108,99,255,.18);border-color:#b8b0ff}
.pecs-card:active{transform:scale(0.93)}
.pecs-card.added{border-color:#6C63FF;background:#f0eeff}
.pecs-card.custom-card{border-color:#fd79a8}
.card-emoji{font-size:30px;line-height:1}
.card-photo{width:54px;height:54px;border-radius:10px;object-fit:cover}
.card-label{font-size:10px;font-weight:800;color:#4a4580;text-align:center;text-transform:uppercase;letter-spacing:.3px;line-height:1.2}
.card-del{position:absolute;top:4px;right:4px;background:#ff6b6b;color:white;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:900;align-items:center;justify-content:center;display:none}
.pecs-card:hover .card-del{display:flex}
.sound-wave{position:absolute;bottom:3px;right:3px;font-size:9px;color:#b8b0ff}

/* history */
.history-list{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.history-item{background:white;border-radius:12px;border:1.5px solid #e8e4ff;padding:10px 12px}
.history-time{font-size:11px;color:#9b97cc;font-weight:700;margin-bottom:5px}
.history-sentence{display:flex;gap:5px;flex-wrap:wrap}
.history-chip{background:#f0eeff;color:#6C63FF;border-radius:7px;padding:3px 7px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:3px}
.export-bar{padding:10px 12px;background:#faf9ff;border-bottom:1px solid #e8e4ff}
.btn-export{background:linear-gradient(135deg,#6C63FF,#48CAE4);color:white;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;width:100%;font-family:'Nunito',sans-serif}

/* parent */
.parent-section{padding:12px}
.section-title{font-size:13px;font-weight:900;color:#4a4580;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.stat-card{background:white;border-radius:12px;border:1.5px solid #e8e4ff;padding:10px;text-align:center}
.stat-num{font-size:26px;font-weight:900;color:#6C63FF}
.stat-lbl{font-size:10px;color:#9b97cc;font-weight:700;margin-top:1px}
.chart-bar{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.chart-bar-label{font-size:10px;font-weight:700;color:#4a4580;width:56px;text-align:right;flex-shrink:0}
.chart-bar-track{flex:1;background:#f0eeff;border-radius:5px;height:16px;overflow:hidden}
.chart-bar-fill{height:100%;background:linear-gradient(90deg,#6C63FF,#48CAE4);border-radius:5px;display:flex;align-items:center;padding-left:5px;transition:width .6s}
.chart-bar-val{font-size:9px;font-weight:800;color:white}

/* rewards */
.rewards-section{padding:12px}
.reward-card{background:white;border-radius:12px;border:2px solid #e8e4ff;padding:10px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.reward-card.unlocked{border-color:#fdcb6e;background:#fffbf0}
.reward-icon{font-size:32px;flex-shrink:0}
.reward-name{font-size:12px;font-weight:900;color:#4a4580}
.reward-desc{font-size:10px;color:#9b97cc;font-weight:600;margin-top:1px}
.reward-prog{height:5px;background:#f0eeff;border-radius:3px;margin-top:5px;overflow:hidden}
.reward-prog-fill{height:100%;background:linear-gradient(90deg,#fdcb6e,#e17055);border-radius:3px;transition:width .6s}
.reward-badge{font-size:10px;font-weight:800;color:#fdcb6e;background:#fffbf0;border-radius:6px;padding:3px 7px;border:1.5px solid #fdcb6e;flex-shrink:0;margin-left:auto}

/* editor */
.editor-section{padding:12px}
.editor-form{background:white;border-radius:14px;border:1.5px solid #e8e4ff;padding:12px;margin-bottom:10px}
.form-label{font-size:11px;font-weight:800;color:#4a4580;margin-bottom:3px;display:block}
.form-row{margin-bottom:9px}
.form-input{width:100%;border:1.5px solid #e8e4ff;border-radius:8px;padding:7px 9px;font-size:12px;font-family:'Nunito',sans-serif;font-weight:700;color:#4a4580;outline:none}
.form-input:focus{border-color:#6C63FF}
.emoji-picker{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.emoji-opt{font-size:20px;cursor:pointer;padding:3px;border-radius:7px;border:2px solid transparent;transition:all .12s}
.emoji-opt.selected{border-color:#6C63FF;background:#f0eeff}
.photo-upload-area{border:2px dashed #e0deff;border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;margin-top:4px}
.photo-upload-area:hover{border-color:#6C63FF;background:#f8f7ff}
.photo-preview{width:60px;height:60px;border-radius:10px;object-fit:cover;margin:0 auto 6px;display:block}
.upload-label{font-size:11px;font-weight:700;color:#9b97cc}
.btn-add-card{background:linear-gradient(135deg,#6C63FF,#48CAE4);color:white;border:none;border-radius:10px;padding:10px;width:100%;font-size:13px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif}
.mode-toggle{display:flex;gap:6px;margin-bottom:8px}
.mode-btn{flex:1;border:2px solid #e8e4ff;border-radius:8px;padding:6px;font-size:11px;font-weight:800;cursor:pointer;background:white;font-family:'Nunito',sans-serif;color:#9b97cc;transition:all .15s}
.mode-btn.active{background:#6C63FF;color:white;border-color:#6C63FF}

/* feedback */
.feedback-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(108,99,255,.96);color:white;border-radius:18px;padding:12px 22px;font-size:14px;font-weight:800;display:none;z-index:999;text-align:center;pointer-events:none;max-width:250px}
.feedback-flash.show{display:block;animation:fadeInOut 1.8s forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
.star-burst{position:fixed;pointer-events:none;z-index:1000;animation:starFly 1s forwards}
@keyframes starFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-100px) scale(1.6)}}
.empty-state{text-align:center;padding:36px 16px;color:#c0b8f0}
.empty-state .big{font-size:40px;margin-bottom:8px}
.empty-state p{font-size:12px;font-weight:700}
</style>

<div id="app">
<div class="header">
  <div style="font-size:28px">🗣️</div>
  <div>
    <div class="header-title" id="appTitle">Я говорю!</div>
    <div class="header-sub" id="appSub">Система общения через карточки</div>
  </div>
  <div class="header-right">
    <button class="lang-btn" onclick="cycleLang()">🌍 <span id="langLabel">РУС</span></button>
    <div class="stars-badge">⭐ <span id="starCount">0</span></div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab active" onclick="switchTab('cards')" id="tab-cards">🃏 <span class="t-cards">Карточки</span></div>
  <div class="tab" onclick="switchTab('history')" id="tab-history">📋 <span class="t-history">История</span></div>
  <div class="tab" onclick="switchTab('parent')" id="tab-parent">👨‍👩‍👧 <span class="t-parent">Родитель</span></div>
  <div class="tab" onclick="switchTab('rewards')" id="tab-rewards">🏆 <span class="t-rewards">Награды</span></div>
  <div class="tab" onclick="switchTab('editor')" id="tab-editor">✏️ <span class="t-editor">Создать</span></div>
</div>

<!-- CARDS -->
<div id="section-cards">
  <div class="sentence-bar" id="sentenceBar">
    <div class="sentence-placeholder" id="placeholder">...</div>
  </div>
  <div class="action-bar">
    <button class="btn btn-speak" onclick="speakSentence()" id="speakBtn">🔊 <span class="t-speak">Произнести</span></button>
    <button class="btn btn-clear" onclick="clearSentence()">✕</button>
  </div>
  <div class="cat-tabs" id="catTabs"></div>
  <div class="cards-grid" id="cardsGrid"></div>
</div>

<!-- HISTORY -->
<div id="section-history" style="display:none">
  <div class="export-bar">
    <button class="btn-export" onclick="exportPDF()">📤 <span class="t-export">Экспорт истории в PDF</span></button>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

<!-- PARENT -->
<div id="section-parent" style="display:none">
  <div class="parent-section">
    <div class="section-title">📊 <span class="t-analytics">Аналитика</span></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl t-stotal">Всего просьб</div></div>
      <div class="stat-card"><div class="stat-num" id="statToday">0</div><div class="stat-lbl t-stoday">Сегодня</div></div>
      <div class="stat-card"><div class="stat-num" id="statUnique">0</div><div class="stat-lbl t-sunique">Разных слов</div></div>
      <div class="stat-card"><div class="stat-num" id="statCards">0</div><div class="stat-lbl t-scards">Карточек</div></div>
    </div>
    <div class="section-title">🔥 <span class="t-topwords">Топ слов</span></div>
    <div id="topWords"></div>
  </div>
</div>

<!-- REWARDS -->
<div id="section-rewards" style="display:none">
  <div class="rewards-section">
    <div class="section-title">🌟 <span class="t-achievements">Достижения</span></div>
    <div id="rewardsList"></div>
  </div>
</div>

<!-- EDITOR -->
<div id="section-editor" style="display:none">
  <div class="editor-section">
    <div class="section-title">✏️ <span class="t-createcard">Создать карточку</span></div>
    <div class="editor-form">
      <div class="form-row">
        <label class="form-label t-cardname">Название</label>
        <input class="form-input" id="newLabel" maxlength="14">
      </div>
      <div class="form-row">
        <label class="form-label t-cardcat">Категория</label>
        <select class="form-input" id="newCat"></select>
      </div>
      <div class="form-row">
        <label class="form-label t-icontype">Тип иконки</label>
        <div class="mode-toggle">
          <button class="mode-btn active" id="modeEmoji" onclick="setMode('emoji')">😊 Эмодзи</button>
          <button class="mode-btn" id="modePhoto" onclick="setMode('photo')">📷 Фото</button>
        </div>
      </div>
      <div id="emojiSection" class="form-row">
        <div class="emoji-picker" id="emojiPicker"></div>
      </div>
      <div id="photoSection" class="form-row" style="display:none">
        <div class="photo-upload-area" onclick="document.getElementById('photoInput').click()">
          <img id="photoPreview" class="photo-preview" src="" style="display:none">
          <div class="upload-label" id="uploadLabel">📷 Нажми чтобы выбрать фото</div>
        </div>
        <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">
      </div>
      <button class="btn-add-card" onclick="addCustomCard()">➕ <span class="t-addcard">Добавить</span></button>
    </div>
    <div class="section-title"><span class="t-mycards">Мои карточки</span> (<span id="customCount">0</span>)</div>
    <div class="cards-grid" id="customCardsGrid"></div>
  </div>
</div>
</div>

<div class="feedback-flash" id="feedback"></div>

const LANG_ORDER = ['ru','kz','en'];
let langIdx = 0;
let L = LANGS.ru;

function cycleLang() {
  langIdx = (langIdx+1)%3;
  L = LANGS[LANG_ORDER[langIdx]];
  applyLang();
  renderCatTabs(); renderCards(); renderRewards(); renderHistory();
  populateCatSelect();
}
function applyLang() {
  const qs = (sel,txt) => document.querySelectorAll(sel).forEach(e=>e.textContent=txt);
  document.getElementById('appTitle').textContent = L.appTitle;
  document.getElementById('appSub').textContent = L.appSub;
  document.getElementById('langLabel').textContent = L.langLabel;
  document.getElementById('placeholder').textContent = L.placeholder;
  qs('.t-speak', L.speak); qs('.t-export', L.export); qs('.t-analytics', L.analytics);
  qs('.t-topwords', L.topwords); qs('.t-achievements', L.achievements);
  qs('.t-createcard', L.createcard); qs('.t-cardname', L.cardname);
  qs('.t-cardcat', L.cardcat); qs('.t-icontype', L.icontype);
  qs('.t-addcard', L.addcard); qs('.t-mycards', L.mycards);
  qs('.t-stotal', L.stotal); qs('.t-stoday', L.stoday);
  qs('.t-sunique', L.sunique); qs('.t-scards', L.scards);
  qs('.t-cards', L.cards); qs('.t-history', L.history);
  qs('.t-parent', L.parent); qs('.t-rewards', L.rewards); qs('.t-editor', L.editor);
}

  {id:14,emoji:'🤕',ru:'Больно',kz:'Ауырады',en:'Hurt',cat:'feelings'},
  {id:15,emoji:'😨',ru:'Страшно',kz:'Қорқынышты',en:'Scared',cat:'feelings'},
  {id:16,emoji:'🤗',ru:'Обнять',kz:'Құшақта',en:'Hug',cat:'actions'},
  {id:17,emoji:'▶️',ru:'Играть',kz:'Ойнау',en:'Play',cat:'actions'},
  {id:18,emoji:'😴',ru:'Спать',kz:'Ұйықтау',en:'Sleep',cat:'actions'},

  {id:22,emoji:'🚗',ru:'Машина',kz:'Машина',en:'Car',cat:'places'},
  {id:23,emoji:'🛁',ru:'Ванна',kz:'Ванна',en:'Bath',cat:'places'},
  {id:24,emoji:'👩',ru:'Мама',kz:'Апа',en:'Mom',cat:'people'},
  {id:25,emoji:'👨',ru:'Папа',kz:'Әке',en:'Dad',cat:'people'},
  {id:26,emoji:'👦',ru:'Я',kz:'Мен',en:'Me',cat:'people'},
  {id:27,emoji:'🙏',ru:'Пожалуйста',kz:'Өтінемін',en:'Please',cat:'needs'},
  {id:28,emoji:'✅',ru:'Да',kz:'Иә',en:'Yes',cat:'needs'},
  {id:29,emoji:'❌',ru:'Нет',kz:'Жоқ',en:'No',cat:'needs'},
  {id:30,emoji:'🆘',ru:'Помощь',kz:'Көмек',en:'Help',cat:'needs'},
  {id:31,emoji:'🚽',ru:'Туалет',kz:'Дәретхана',en:'Toilet',cat:'needs'},
];

const CAT_IDS = ['all','food','drink','feelings','actions','places','people','needs'];
const EMOJI_POOL = ['🍫','🍦','🍩','🧁','🍇','🍓','🥝','🌽','🥕','🧀','🌮','🍜','🥐','🍰','🎈','🎮','🚲','🐶','🐱','🌈','⚽','🎵','📚','🎨','🛴','🧸','🦋','🌸','🎀','🚀'];
const REWARD_DEFS = [
  {id:'r1',icon:'🌟',need:1,key:'total'},{id:'r2',icon:'🎉',need:5,key:'total'},
  {id:'r3',icon:'🏆',need:10,key:'total'},{id:'r4',icon:'👑',need:20,key:'total'},
  {id:'r5',icon:'📚',need:5,key:'unique'},{id:'r6',icon:'🧠',need:10,key:'unique'},
  {id:'r7',icon:'✨',need:1,key:'custom'},
];

// card sounds: different tones per category
const CAT_TONES = {food:523,drink:587,feelings:659,actions:784,places:698,people:880,needs:440};

let sentence=[], history=[], customCards=[], nextId=200;
let activeCategory='all', stars=0, totalRequests=0, wordCount={};
let selectedEmoji=EMOJI_POOL[0], photoDataURL=null, editorMode='emoji';

function getLabel(card) {
  const lang = LANG_ORDER[langIdx];
  return card[lang] || card.ru || card.label || '';
}

function init() {
  applyLang();
  renderCatTabs();
  renderCards();
  renderEmojiPicker();
  populateCatSelect();
  renderRewards();
  renderCustomCards();
}

function renderCatTabs() {
  const cats = L.cats;
  document.getElementById('catTabs').innerHTML = CAT_IDS.map((id,i)=> {
    const label = cats[i]||id;
    const colors = ['#6C63FF','#ff7675','#74b9ff','#fdcb6e','#55efc4','#a29bfe','#fd79a8','#00b894'];
    const active = id===activeCategory;
    return `<button class="cat-btn" style="${active?'background:'+colors[i]+';color:white;border-color:'+colors[i]:''}" onclick="setCategory('${id}')">${label}</button>`;
  }).join('');
}

function setCategory(id){activeCategory=id;renderCatTabs();renderCards()}

function renderCards() {
  const allCards = [...CARD_DATA, ...customCards];
  const filtered = activeCategory==='all' ? allCards : allCards.filter(c=>c.cat===activeCategory);
  const addedIds = sentence.map(s=>s.id);
  document.getElementById('cardsGrid').innerHTML = filtered.map(card => {
    const label = getLabel(card);
    const img = card.photo ? `<img src="${card.photo}" class="card-photo">` : `<div class="card-emoji">${card.emoji||'❓'}</div>`;
    const tone = CAT_TONES[card.cat]||523;
    return `<div class="pecs-card${addedIds.includes(card.id)?' added':''}${card.custom?' custom-card':''}" onclick="addCard(${card.id})">
      ${card.custom?`<button class="card-del" onclick="event.stopPropagation();deleteCustom(${card.id})">✕</button>`:''}
      ${img}
      <div class="card-label">${label}</div>
      <div class="sound-wave">♪</div>
    </div>`;
  }).join('');
}

function addCard(id) {
  if(sentence.length>=6){showFeedback(L.maxcards);return}
  const all=[...CARD_DATA,...customCards];
  const card=all.find(c=>c.id===id);
  sentence.push(card);
  playTone(CAT_TONES[card.cat]||523);
  renderSentence(); renderCards();
}

function renderSentence() {
  const bar=document.getElementById('sentenceBar');
  document.getElementById('placeholder').style.display=sentence.length?'none':'block';
  bar.querySelectorAll('.sentence-card').forEach(e=>e.remove());
  sentence.forEach((card,i)=>{
    const el=document.createElement('div');
    el.className='sentence-card';
    const media = card.photo
      ? `<img src="${card.photo}" class="sph">`
      : `<span class="sem">${card.emoji||'❓'}</span>`;
    el.innerHTML=`<span class="srm" onclick="removeFromSentence(${i})">✕</span>${media}<span class="slb">${getLabel(card)}</span>`;
    bar.appendChild(el);
  });
}

function removeFromSentence(i){sentence.splice(i,1);renderSentence();renderCards()}
function clearSentence(){sentence=[];renderSentence();renderCards()}

function speakSentence() {
  if(!sentence.length){showFeedback(L.addFirst);return}
  const text = sentence.map(c=>getLabel(c)).join(', ');
  if('speechSynthesis'in window){
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(L.iwant+text);
    u.lang=L.voiceLang; u.rate=0.85; u.pitch=1.1;
    window.speechSynthesis.speak(u);
  }
  sentence.forEach(c=>{const lbl=getLabel(c);wordCount[lbl]=(wordCount[lbl]||0)+1});
  totalRequests++; stars+=sentence.length;
  document.getElementById('starCount').textContent=stars;
  history.unshift({time:new Date(),cards:[...sentence]});
  if(history.length>30)history.pop();
  showFeedback('🗣️ '+L.iwant+text);
  burstStars(); checkRewards(); renderCards();
}

function playTone(freq) {
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(); const g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.1,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);
    o.start(ctx.currentTime); o.stop(ctx.currentTime+.18);
  }catch(e){}
}

function burstStars(){
  ['⭐','🌟','✨'].forEach((s,i)=>setTimeout(()=>{
    const el=document.createElement('div');
    el.className='star-burst'; el.textContent=s;
    el.style.cssText=`left:${30+i*90}px;top:100px;position:fixed;font-size:26px;`;
    document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
  },i*130));
}

function showFeedback(msg){
  const el=document.getElementById('feedback');
  el.textContent=msg; el.className='feedback-flash show';
  setTimeout(()=>el.className='feedback-flash',1900);
}

function switchTab(name){
  ['cards','history','parent','rewards','editor'].forEach(t=>{
    document.getElementById('section-'+t).style.display=t===name?'block':'none';
    document.getElementById('tab-'+t).className='tab'+(t===name?' active':'');
  });
  if(name==='history')renderHistory();
  if(name==='parent')renderAnalytics();
  if(name==='rewards')renderRewards();
  if(name==='editor'){renderCustomCards();renderEmojiPicker();populateCatSelect()}
}

function renderHistory() {
  const list=document.getElementById('historyList');
  if(!history.length){list.innerHTML=`<div class="empty-state"><div class="big">📋</div><p>${L.noHistory}</p></div>`;return}
  list.innerHTML=history.map(h=>{
    const t=h.time;
    const time=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    return `<div class="history-item"><div class="history-time">${time}</div><div class="history-sentence">${h.cards.map(c=>`<div class="history-chip"><span>${c.photo?'📷':c.emoji}</span>${getLabel(c)}</div>`).join('')}</div></div>`;
  }).join('');
}

function renderAnalytics() {
  document.getElementById('statTotal').textContent=totalRequests;
  document.getElementById('statToday').textContent=history.filter(h=>h.time.toDateString()===new Date().toDateString()).length;
  document.getElementById('statUnique').textContent=Object.keys(wordCount).length;
  document.getElementById('statCards').textContent=CARD_DATA.length+customCards.length;
  const sorted=Object.entries(wordCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const max=sorted[0]?sorted[0][1]:1;
  document.getElementById('topWords').innerHTML=sorted.length?sorted.map(([w,n])=>
    `<div class="chart-bar"><div class="chart-bar-label">${w}</div><div class="chart-bar-track"><div class="chart-bar-fill" style="width:${Math.round(n/max*100)}%"><span class="chart-bar-val">${n}</span></div></div></div>`
  ).join(''):`<div style="color:#c0b8f0;font-size:11px;font-weight:700;padding:8px 0">—</div>`;
}

function renderRewards() {
  const unique=Object.keys(wordCount).length;
  const customCount=customCards.length;
  const rnames=L.rewards;
  document.getElementById('rewardsList').innerHTML=REWARD_DEFS.map((r,i)=>{
    let progress=0;
    if(r.key==='total')progress=Math.min(totalRequests,r.need);
    if(r.key==='unique')progress=Math.min(unique,r.need);
    if(r.key==='custom')progress=Math.min(customCount,r.need);
    const pct=Math.round(progress/r.need*100);
    const unlocked=progress>=r.need;
    const rd=rnames[i]||{name:'',desc:''};
    return `<div class="reward-card${unlocked?' unlocked':''}">
      <div class="reward-icon">${r.icon}</div>
      <div style="flex:1"><div class="reward-name">${rd.name}</div><div class="reward-desc">${rd.desc}</div>
      <div class="reward-prog"><div class="reward-prog-fill" style="width:${pct}%"></div></div></div>
      <div class="reward-badge">${unlocked?'✅':`${progress}/${r.need}`}</div>
    </div>`;
  }).join('');
}

function checkRewards(){renderRewards()}

// ── EDITOR ──
function populateCatSelect() {
  const sel=document.getElementById('newCat');
  const catLabels=L.cats.slice(1);
  const catIds=CAT_IDS.slice(1);
  sel.innerHTML=catIds.map((id,i)=>`<option value="${id}">${catLabels[i]||id}</option>`).join('');
}

function renderEmojiPicker() {
  document.getElementById('emojiPicker').innerHTML=EMOJI_POOL.map(e=>
    `<span class="emoji-opt${e===selectedEmoji?' selected':''}" onclick="selectEmoji('${e}')">${e}</span>`
  ).join('');
}

function selectEmoji(e){selectedEmoji=e;renderEmojiPicker()}

function setMode(mode) {
  editorMode=mode;
  document.getElementById('modeEmoji').className='mode-btn'+(mode==='emoji'?' active':'');
  document.getElementById('modePhoto').className='mode-btn'+(mode==='photo'?' active':'');
  document.getElementById('emojiSection').style.display=mode==='emoji'?'block':'none';
  document.getElementById('photoSection').style.display=mode==='photo'?'block':'none';
}

function handlePhoto(e) {
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    photoDataURL=ev.target.result;
    const prev=document.getElementById('photoPreview');
    prev.src=photoDataURL; prev.style.display='block';
    document.getElementById('uploadLabel').textContent='✅ Фото выбрано';
  };
  reader.readAsDataURL(file);
}

function addCustomCard() {
  const label=document.getElementById('newLabel').value.trim();
  if(!label){showFeedback(L.enterName);return}
  const catEl=document.getElementById('newCat');
  const cat=catEl.value;
  const card={id:nextId++,ru:label,kz:label,en:label,label,cat,custom:true};
  if(editorMode==='photo'&&photoDataURL){card.photo=photoDataURL;}
  else{card.emoji=selectedEmoji;}
  customCards.push(card);
  document.getElementById('newLabel').value='';
  photoDataURL=null;
  document.getElementById('photoPreview').style.display='none';
  document.getElementById('uploadLabel').textContent='📷 Нажми чтобы выбрать фото';
  document.getElementById('customCount').textContent=customCards.length;
  renderCustomCards(); renderCards();
  showFeedback(L.added);
}

function renderCustomCards() {
  document.getElementById('customCount').textContent=customCards.length;
  if(!customCards.length){
    document.getElementById('customCardsGrid').innerHTML=`<div style="grid-column:span 3;text-align:center;padding:18px;color:#c0b8f0;font-size:11px;font-weight:700">—</div>`;return;
  }
  document.getElementById('customCardsGrid').innerHTML=customCards.map(c=>{
    const img=c.photo?`<img src="${c.photo}" class="card-photo">`:`<div class="card-emoji">${c.emoji||'❓'}</div>`;
    return `<div class="pecs-card custom-card" onclick="addCard(${c.id})">
      <button class="card-del" style="display:flex" onclick="event.stopPropagation();deleteCustom(${c.id})">✕</button>
      ${img}<div class="card-label">${getLabel(c)}</div></div>`;
  }).join('');
}

function deleteCustom(id){customCards=customCards.filter(c=>c.id!==id);renderCustomCards();renderCards()}

// ── EXPORT PDF ──
function exportPDF() {
  if(!history.length){showFeedback(L.noHistory);return}
  const rows = history.map(h=>{
    const t=h.time;
    const time=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    const words=h.cards.map(c=>`${c.emoji||'📷'} ${getLabel(c)}`).join('  ·  ');
    return `<tr><td style="padding:6px 10px;color:#666;font-size:12px;white-space:nowrap">${time}</td><td style="padding:6px 10px;font-size:13px;font-weight:700">${words}</td></tr>`;
  }).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>PECS History</title>
  <style>body{font-family:sans-serif;padding:30px}h1{color:#6C63FF;margin-bottom:4px}p{color:#999;font-size:13px;margin-bottom:20px}table{width:100%;border-collapse:collapse}tr:nth-child(even){background:#f8f7ff}td{border-bottom:1px solid #eee}</style>
  </head><body>
  <h1>🗣️ ${L.appTitle}</h1>
  <p>${new Date().toLocaleDateString()} · ${history.length} записей · ⭐ ${stars}</p>
  <table>${rows}</table>
  </body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='pecs-history.html'; a.click();
  URL.revokeObjectURL(url);
  showFeedback('📤 Файл сохранён!');
}

init();
</script>
